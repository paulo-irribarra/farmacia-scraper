version: "3.9"
services:
  db:
    image: postgres:16
    container_name: meds_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin12345
      POSTGRES_DB: meds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d  # opcional (scripts .sql de inicio)
volumes:
  pgdata:
